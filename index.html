<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Ordering System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Title -->
        <h2 id="page-title">Restaurant Menu</h2>

        <!-- 1. Customer Name Input -->
        <input type="text" id="customerName" placeholder="Enter your name...">
        <br>

        <!-- 2. Order Select Menu -->
        <select id="foodOrder">
            <option value="Burger">Burger</option>
            <option value="Shawarma">Shawarma</option>
            <option value="Zinger">Zinger</option>
        </select>
        <br>

        <!-- 3. Submit Button (with ID and Class) -->
        <button id="submitBtn" class="btn-style">Submit Order</button>

        <!-- 4. Result Message Area -->
        <p id="resultMessage" style="font-weight: bold; color: green; font-size: 18px;"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
